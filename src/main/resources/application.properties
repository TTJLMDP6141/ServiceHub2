spring.application.name=urban-services
server.port=${PORT:8080}

# H2 file database: data survives restarts and stays in this project folder.
spring.datasource.url=jdbc:h2:file:./urbanservices;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Enable only when working locally. Keep disabled on public deployments.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Demo users are created only when every value is supplied from the local environment.
app.demo-seed-password=${URBAN_SERVICES_DEMO_PASSWORD:}
app.demo-admin-email=${URBAN_SERVICES_DEMO_ADMIN_EMAIL:}
app.demo-customer-email=${URBAN_SERVICES_DEMO_CUSTOMER_EMAIL:}
app.demo-provider-email=${URBAN_SERVICES_DEMO_PROVIDER_EMAIL:}

# Admin registration is disabled until an invite code is configured outside source control.
app.admin-registration-code=${ADMIN_REGISTRATION_CODE:}

spring.thymeleaf.cache=false

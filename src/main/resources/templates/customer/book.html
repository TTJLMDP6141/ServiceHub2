<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Book a service | Urban Services</title><link rel="stylesheet" th:href="@{/css/site.css}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="container narrow">
    <div class="page-heading"><div><span class="eyebrow">New appointment</span><h1>Book <span th:text="${service.name}">a service</span></h1><p th:text="'₹' + ${#numbers.formatDecimal(service.price, 1, 0)} + ' · ' + ${service.durationMinutes} + ' minutes'">Price and duration</p></div></div>
    <section class="form-card">
        <form th:action="@{/customer/book}" th:object="${form}" method="post">
            <input type="hidden" th:field="*{serviceId}">
            <div class="field"><label for="bookingDate">Appointment date</label><input id="bookingDate" type="date" th:field="*{bookingDate}" required><span class="field-error" th:errors="*{bookingDate}"></span></div>
            <div class="field"><label for="bookingTime">Available time</label><select id="bookingTime" th:field="*{bookingTime}"><option value="">Select a time</option><option th:each="slot : ${timeSlots}" th:value="${slot}" th:text="${slot}"></option></select><span class="field-error" th:errors="*{bookingTime}"></span></div>
            <div class="field"><label for="phone">Contact phone</label><input id="phone" th:field="*{phone}" autocomplete="tel"><span class="field-error" th:errors="*{phone}"></span></div>
            <div class="field"><label for="address">Service address</label><textarea id="address" th:field="*{address}" autocomplete="street-address"></textarea><span class="field-error" th:errors="*{address}"></span></div>
            <div class="form-actions"><button class="button" type="submit">Confirm booking</button><a class="button secondary" th:href="@{/services/{id}(id=${service.id})}">Go back</a></div>
        </form>
    </section>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>

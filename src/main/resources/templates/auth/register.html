<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account | Urban Services</title><link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="container narrow">
    <section class="form-card">
        <span class="eyebrow">Get started</span><h1>Create your account</h1>
        <p class="welcome">Choose Customer or Service Provider to sign up. Administrator accounts require an invite code.</p>
        <form th:action="@{/register}" th:object="${registerForm}" method="post">
            <div class="field"><label for="name">Full name</label><input id="name" th:field="*{name}" autocomplete="name"><span class="field-error" th:errors="*{name}"></span></div>
            <div class="field"><label for="email">Email</label><input id="email" type="email" th:field="*{email}" autocomplete="email"><span class="field-error" th:errors="*{email}"></span></div>
            <div class="field"><label for="phone">Phone</label><input id="phone" th:field="*{phone}" autocomplete="tel"><span class="field-error" th:errors="*{phone}"></span></div>
            <div class="field"><label for="role">Account type</label>
                <select id="role" th:field="*{role}" onchange="updateRegistrationFields()">
                    <option value="CUSTOMER">Customer</option><option value="PROVIDER">Service Provider</option><option value="ADMIN">Administrator</option>
                </select><span class="field-error" th:errors="*{role}"></span>
            </div>
            <div id="provider-fields" th:hidden="${registerForm.role != 'PROVIDER'}">
                <div class="field"><label for="experience">Years of experience</label><input id="experience" type="number" min="0" max="60" th:field="*{experience}"><span class="field-error" th:errors="*{experience}"></span></div>
                <div class="field"><label for="availability">Availability</label><input id="availability" th:field="*{availability}" placeholder="Monday to Saturday"></div>
            </div>
            <div id="admin-fields" th:hidden="${registerForm.role != 'ADMIN'}">
                <div class="field"><label for="adminInviteCode">Administrator invite code</label><input id="adminInviteCode" type="password" th:field="*{adminInviteCode}" autocomplete="off" aria-describedby="admin-invite-help"><span id="admin-invite-help" class="field-hint">This code is provided by the app owner and is never stored in the project source.</span><span class="field-error" th:errors="*{adminInviteCode}"></span></div>
            </div>
            <div class="field"><label for="password">Password</label><input id="password" type="password" th:field="*{password}" autocomplete="new-password"><span class="field-hint">Use at least 8 characters.</span><span class="field-error" th:errors="*{password}"></span></div>
            <div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" th:field="*{confirmPassword}" autocomplete="new-password"><span class="field-error" th:errors="*{confirmPassword}"></span></div>
            <button class="button" type="submit">Create account</button>
        </form>
    </section>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<script>
    function updateRegistrationFields() {
        const role = document.getElementById('role').value;
        document.getElementById('provider-fields').hidden = role !== 'PROVIDER';
        document.getElementById('admin-fields').hidden = role !== 'ADMIN';
    }
</script>
</body>
</html>

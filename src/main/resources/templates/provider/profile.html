<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Provider profile | Urban Services</title><link rel="stylesheet" th:href="@{/css/site.css}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="container narrow">
    <div th:replace="~{fragments :: alerts}"></div>
    <section class="form-card">
        <span class="eyebrow">Provider details</span><h1>Your profile</h1>
        <form th:action="@{/provider/profile}" th:object="${form}" method="post">
            <div class="field"><label for="name">Name</label><input id="name" th:field="*{name}"><span class="field-error" th:errors="*{name}"></span></div>
            <div class="field"><label for="email">Email</label><input id="email" type="email" th:value="${email}" disabled><span class="field-hint">Email is managed by your account.</span></div>
            <div class="field"><label for="phone">Phone</label><input id="phone" th:field="*{phone}"><span class="field-error" th:errors="*{phone}"></span></div>
            <div class="field"><label for="experience">Years of experience</label><input id="experience" type="number" min="0" max="60" th:field="*{experience}"><span class="field-error" th:errors="*{experience}"></span></div>
            <div class="field"><label for="availability">Availability</label><input id="availability" th:field="*{availability}"><span class="field-error" th:errors="*{availability}"></span></div>
            <button class="button" type="submit">Save profile</button>
        </form>
    </section>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
